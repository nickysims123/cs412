<form method="GET">

    <label>Party:
        <select name="party">
            <option value="">-- Any --</option>
            {% for p in parties %}
            <option value="{{ p }}" {% if params.party == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Min Birth Year:
        <select name="min_dob">
            <option value="">-- Any --</option>
            {% for y in years %}
            <option value="{{ y }}" {% if params.min_dob == y|stringformat:"s" %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Max Birth Year:
        <select name="max_dob">
            <option value="">-- Any --</option>
            {% for y in years %}
            <option value="{{ y }}" {% if params.max_dob == y|stringformat:"s" %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Voter Score:
        <select name="voter_score">
            <option value="">-- Any --</option>
            {% for s in scores %}
            <option value="{{ s }}" {% if params.voter_score == s|stringformat:"s" %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </label>

    <fieldset>
        <legend>Voted in Election:</legend>
        <label><input type="checkbox" name="v20state" {% if params.v20state %}checked{% endif %}> 2020 State</label>
        <label><input type="checkbox" name="v21town" {% if params.v21town %}checked{% endif %}> 2021 Town</label>
        <label><input type="checkbox" name="v21primary" {% if params.v21primary %}checked{% endif %}> 2021 Primary</label>
        <label><input type="checkbox" name="v22general" {% if params.v22general %}checked{% endif %}> 2022 General</label>
        <label><input type="checkbox" name="v23town" {% if params.v23town %}checked{% endif %}> 2023 Town</label>
    </fieldset>

    <button type="submit">Filter</button>
    <a href="{{ request.path }}">Clear</a>

</form>
