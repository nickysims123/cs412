{% extends 'project/base.html' %}

{% block content %}

<h1>Add Department</h1>

<form action="{% url 'create_department' %}" method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <br>

    <input type="submit" value="Create Department">
    <a href="{% url 'show_all_departments' %}">Cancel</a>
</form>

{% endblock %}
