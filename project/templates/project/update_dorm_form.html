{% extends 'project/base.html' %}

{% block content %}

<h1>Edit Dorm: {{ dorm.name }}</h1>

<form action="{% url 'update_dorm' dorm.pk %}" method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <br>

    <input type="submit" value="Save Changes">
    <a href="{% url 'show_all_dorms' %}">Cancel</a>
</form>

{% endblock %}
