{% extends 'mini_insta/base.html' %}

{% block content %}

<h1>Update Profile</h1>

<form action="{% url 'update_profile' %}" method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <br>

    <input type="submit" value="Save Changes">
    <a href="{% url 'show_profile' profile.pk %}">Cancel</a>
</form>

{% endblock %}
