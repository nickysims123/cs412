{% extends 'mini_insta/base.html' %}

{% block content %}

<h1>Search</h1>

<form action="{% url 'search' profile.pk %}" method="get">
    <label for="query">Search profiles and posts:</label>
    <input type="text" name="query" id="query" placeholder="Enter search term">
    <button type="submit">Search</button>
</form>

{% endblock %}
